services:
  binance-trading-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binance-trading-system
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3335}:3335"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3335/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

